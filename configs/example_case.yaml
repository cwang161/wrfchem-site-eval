case:
  name: BASE2020
  label: WRF-Chem baseline simulation

wrf:
  input_dir: /path/to/BASE2020/wrfout
  file_pattern: "wrfout_d01_*"
  domain: d01
  # Optional but recommended when wrfout does not contain XLAT/XLONG.
  grid_file: /path/to/geo_em.d01.nc
  grid_latitude_variable: XLAT_M
  grid_longitude_variable: XLONG_M
  reduction:
    # false: extract directly from input_dir; true: create compact files first.
    enabled: false
    output_dir: /path/to/BASE2020/reduced_wrfout
    # Can remain true with enabled: false to use already-created reduced files.
    use_for_extraction: false
    overwrite: false
    compression_level: 2
    # Number of wrfout files reduced concurrently. Start with 2-4 on shared HPC storage.
    workers: 1
    # Raw WRF variable names. Times is added automatically. Grid coordinates
    # come from grid_file and are not copied into every reduced wrfout.
    # Omit this list to infer the minimum set from extraction below.
    variables:
      - T2
      - Q2
      - PSFC
      - U10
      - V10
      - SINALPHA
      - COSALPHA
      - RAINC
      - RAINNC
      - RAINSH
      - PBLH
      - PM2_5_DRY
      - PM10
      - o3
      - no2
      - so2
      - co
    levels:
      # Applied to every retained variable with bottom_top/bottom_top_stag.
      default: surface
      # Optional raw-variable overrides. Indices are zero-based.
      # variables:
      #   o3: [0, 1, 2]
      #   PM2_5_DRY: {start: 0, stop: 3, step: 1}
      #   P: all
      variables: {}

station_groups:
  met:
    enabled: true
    observation_config: configs/observations/isd_met.yaml
    interpolation: bilinear
  chem:
    enabled: true
    observation_config: configs/observations/chem_qc.yaml
    interpolation: bilinear
    include_met_at_sites: true

# Controls what is extracted from WRF and retained in model output files.
# These lists are independent from the variables evaluated below.
extraction:
  # Number of WRF files sampled concurrently. Bilinear weights are unchanged.
  workers: 1
  met:
    - temperature
    - relative_humidity
    - wind_speed
    - wind_direction
    - precipitation
    - surface_pressure
    - pbl_height
  chem:
    - pm25
    - pm10
    - o3
    - no2
    - so2
    - co
  # Used only when station_groups.chem.include_met_at_sites is true.
  met_at_chem_sites:
    - temperature
    - relative_humidity
    - wind_speed
    - wind_direction
    - precipitation
    - surface_pressure
    - pbl_height

# Controls which extracted variables are matched to observations and evaluated.
# Each entry must also occur in the corresponding extraction list.
evaluation:
  met:
    - temperature
    - relative_humidity
    - wind_speed
    - wind_direction
    - precipitation
    - pbl_height
  chem:
    - pm25
    - pm10
    - o3
    - no2
    - so2
    - co

output:
  directory: output/BASE2020
  format: parquet

# Exact hourly matching by default. Set frequency: 1D for daily evaluation;
# precipitation is summed while other numeric variables are averaged.
matching:
  tolerance: null
  frequency: null
  # For combined hourly ISD + daily GSOD use: {default: 20, precipitation: 1}
  observation_minimum_count: null
  model_minimum_count: null
  offset: null

figures:
  enabled: true
