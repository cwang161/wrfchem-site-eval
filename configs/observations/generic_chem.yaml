dataset:
  name: Generic surface chemistry network
  file: /path/to/chem_observations.csv
  format: csv

columns:
  station_id: station_code
  time: datetime
  latitude: latitude
  longitude: longitude

time:
  timezone: Asia/Shanghai
  output_timezone: UTC

variables:
  pm25:
    column: PM2.5
    unit: ug_m-3
  pm10:
    column: PM10
    unit: ug_m-3
  o3:
    column: Ozone
    unit: ug_m-3
  no2:
    column: NO2
    unit: ug_m-3
  so2:
    column: SO2
    unit: ug_m-3
  co:
    column: CO
    unit: mg_m-3

missing_values: [-9999, 9999]
