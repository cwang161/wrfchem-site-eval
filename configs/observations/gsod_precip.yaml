# GSOD 日降水观测配置。输入为已整理的宽表，每行表示一个站点的一天。
# 单独测试：wrfchem-site-eval normalize-observations configs/observations/gsod_precip.yaml \
#   --output output/normalized_gsod.csv
# 此命令读取并标准化日降水观测,包括单位转换和降水时间重写(EOD)等。

dataset:
  # 数据集名称，仅用于说明来源。
  name: GSOD daily precipitation
  # combined_wide：读取一份宽表；多来源合并使用 combined_sources。
  profile: combined_wide
  # 修改为实际路径；相对路径以本 YAML 所在目录为基准。
  file: /Users/cwang161/project/WRFCHEMV3.6.1_ECLIPSEV6b_PAPER1_CHEN_201911_202208/DATA/OBS_DATA/NCDC_GSOD_MET/WRFCHEM_ECLIPSE_combined_data/gsod_2019_daily_with_eod.csv
  # auto 根据扩展名判断文件；csv/txt 按逗号分隔读取,
  # 也支持 xlsx、xls、parquet（相应格式需要解决对应的包依赖).
  format: auto

# 左侧为输出文件的统一输出名称，右侧为输入文件的列名，区分大小写。
# 输入数据必须提供站名,时间,纬度,经度这四列。站点 ID 按字符串读取，避免丢失前导零。
# 经纬度使用十进制度：北纬、东经为正。
# 和 ISD 合并时，两份数据的站点 ID 必须采用相同编码, 比如都为'289480-99999'。
columns:
  station_id: Site
  time: Time
  latitude: LATITUDE
  longitude: LONGITUDE

# 原始时间timezone属于 UTC。如果输入文件实际为当地时间,需填写真实时区,
# 这里使用IANA时区名称，格式通常为地区/城市, 如 Asia/Shanghai.
# 可选: 输出时区output_timezone, 不设置时默认是UTC.
# 可选：format: "%Y-%m-%d %H:%M:%S"，指定输入文件的时间文本格式。不设置,则默认由pandas自动解析.
# 可选：drop_timezone: 转换完成后是否去掉时区标签，不设置默认 true.
# 日期转换为时间戳不代表降水变为小时量，仍是日累计量。
time:
  timezone: UTC

# 开启后：输出 time = GSOD 日期 00 UTC + EOD 小时数。
# time 标记前 24 小时降水的结束时刻；EOD=24 会落在次日 00 UTC。
# 此设置仅用于独立的降水来源；其他气象变量不会随降水一起移动。
# 关闭时保留原来的日期时间；开启时 EOD 列必须存在；非缺测值须为 0–24，缺测使用下方默认值。
precipitation_time:
  reset_using_eod: true
  eod_column: EOD
  # EOD 缺测时按日期次日 00 UTC 作为结束时刻，只打印通过属性筛选且降水有效的 EOD 缺测行。
  missing_eod_hours: 24

variables:
  precipitation:
    # GSOD 日累计降水列。
    column: PRCP
    # 输出 = 原始值 * 25.4，英寸转换为毫米；默认 offset 为 0。
    source_unit: inch
    target_unit: mm
    scale: 25.4
    # 降水属性列必须存在；保留原始标记到 precipitation_qc_flag。
    # 仅接受下面列出的标记，其他标记对应的降水置为缺测（包括 PRCP=0）。
    # 读取时忽略标记大小写；此处保留原配置的 G、D、F 筛选策略。
    # 请根据实际 GSOD 文件的属性说明决定是否调整接受列表。
    qc_flag_column: PRCP_ATTRIBUTES
    accepted_qc_flags: [G, D, F]
    # 所有 PRCP 都按 G/D/F 筛选；通过筛选的 PRCP=0 转为 0.0 mm。
    # 其他属性即使 PRCP=0 也置为缺测；不推断 trace，也不输出 trace 标记。
    # 输出的时候qc_flag是保持大写还是改为小写
    qc_flag_case: upper

# 原始缺测编码，在缩放之前替换为 NaN；请按实际输入调整。
# 此规则作用于整张输入表，而不是只作用于降水列。
missing_values: [99.99, 999.9, 9999.9, 9999]

# 同一站点、同一时间的重复记录：error 报错；first/last 保留首条/末条。
# 此设置不会对重复记录求平均。
duplicate_policy: error

# 可选附加信息：列存在则复制，缺少则跳过；不做单位换算。
metadata:
  station_name: NAME
  elevation_m: ELEVATION

# 与 ISD-lite 合并时，在 isd_met_with_gsod.yaml 中设置来源和坐标冲突规则。
# 当前统一输出名 precipitation 与 ISD 配置相同。
# 若同时保留小时和日降水，可将其中一份的变量名改为 precipitation_daily 等，
# 并在后续匹配/评估中分别设置累计时段，避免把不同时间尺度当作同一个变量合并。
