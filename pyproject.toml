[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wrfchem-site-eval"
version = "0.1.0"
description = "Evaluate WRF/WRF-Chem meteorology and chemistry against stations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
runtime = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "pyarrow>=14.0",
]

[project.scripts]
wrfchem-site-eval = "wrfchem_site_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
